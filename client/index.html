<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Website Content Analyzer</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/tables.css">
<link rel="stylesheet" href="css/responsive.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <div class="container">

        <header>

            <h1>

                🌐 Website Content Analyzer

            </h1>

            <p>

                Analyze any website and get detailed content,
                SEO and keyword statistics.

            </p>

        </header>

        <div class="search-box">

            <input
                id="url"
                type="text"
                placeholder="https://example.com">

            <button id="analyzeBtn">

                Analyze Website

            </button>

        </div>

        <div id="loading"
            class="loading">

            🔄 Analyzing Website...

        </div>

        <div id="results">

    <section id="overviewSection"></section>

    <section id="seoSection"></section>

    <section id="metaSection"></section>

    <section id="headingSection"></section>

    <section id="imageSection"></section>

    <section id="linkSection"></section>

    <section id="keywordSection"></section>

</div>

    </div>

    
    <script src="js/dashboard.js"></script>
    <script src="js/seo.js"></script>
    <script src="js/meta.js"></script>
    <script src="js/headings.js"></script>
    <script src="js/images.js"></script>
    <script src="js/keywords.js"></script>
    <script src="js/links.js"></script>
    <script src="js/script.js"></script>

</body>

</html>
